<!DOCTYPE html>
<html>
<head>
    <title>ORCA Marine Map</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        #panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 12px; border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3); width: 260px;
        }
        #panel input { width: 90px; }
        #result { margin-top: 8px; font-size: 13px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div id="panel">
    <b>ORCA — Check a location</b><br><br>
    Lat: <input id="lat" value="17.5" /><br>
    Lon: <input id="lon" value="83.5" /><br>
    <button onclick="checkLocation()">Check</button>
    <div id="result"></div>
</div>

<div id="map"></div>

<script>
const map = L.map('map').setView([15.0, 80.0], 6);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

let userMarker = null;

// Load and draw live INCOIS PFZ lines
fetch('/pfz-lines')
    .then(res => res.json())
    .then(data => {
        L.geoJSON(data, {
            style: { color: 'green', weight: 2 }
        }).addTo(map);
    })
    .catch(err => console.log("Could not load PFZ lines:", err));

function checkLocation() {
    const lat = parseFloat(document.getElementById('lat').value);
    const lon = parseFloat(document.getElementById('lon').value);

    fetch(`/full-report?latitude=${lat}&longitude=${lon}`)
        .then(res => res.json())
        .then(data => {
            if (userMarker) map.removeLayer(userMarker);
            userMarker = L.marker([lat, lon]).addTo(map)
                .bindPopup("Your location").openPopup();
            map.setView([lat, lon], 8);

            const pfz = data.nearest_pfz;
            const safety = data.safety;

            document.getElementById('result').innerText =
                `Nearest PFZ: ${pfz ? pfz.distance_km + ' km' : 'N/A'}\n` +
                `Status: ${safety.status}\n` +
                `Inside EEZ: ${safety.inside_india_eez}\n` +
                `Inside MPA: ${safety.inside_mpa}\n` +
                `Depth: ${safety.depth_m} m\n` +
                `Warnings:\n` + (safety.warnings.length
                    ? safety.warnings.map(w => "- " + w).join("\n")
                    : "None");
        });
}
</script>

</body>
</html>
